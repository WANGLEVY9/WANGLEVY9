<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 416 222" width="416" height="222" role="img" aria-label="SynTriageGUI">
    <defs>
      <linearGradient id="base" x2="1" y2="1"><stop stop-color="#131e30"/><stop offset="1" stop-color="#0b1020"/></linearGradient>
      <radialGradient id="mist"><stop stop-color="#8ae4ff" stop-opacity=".32"/><stop offset="1" stop-color="#8ae4ff" stop-opacity="0"/></radialGradient>
      <linearGradient id="beam"><stop stop-color="#8ae4ff" stop-opacity=".04"/><stop offset="1" stop-color="#8ae4ff" stop-opacity=".59"/></linearGradient>
      <linearGradient id="shade"><stop offset=".14" stop-color="#101829"/><stop offset="1" stop-color="#101829" stop-opacity="0"/></linearGradient>
      <pattern id="surface" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#8ae4ff" stroke-opacity=".085"/></pattern>
      <clipPath id="clip"><rect x="1" y="1" width="414" height="220" rx="17"/></clipPath>
