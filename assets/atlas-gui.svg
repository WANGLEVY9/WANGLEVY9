    <style>
    .trace {stroke-dasharray:100;animation:trace 2.4s .2s both}
    .radar {transform-origin:0 0;animation:sweep 3.65s ease-out both}
    .panel {animation:lift 2.2s ease-out both}
    .flash {animation:flash 2.6s ease-out both}
    @keyframes trace {from {stroke-dashoffset:100} to {stroke-dashoffset:0}}
    @keyframes sweep {from {transform:rotate(-120deg)} to {transform:rotate(21deg)}}
    @keyframes lift {0%,100% {transform:translateY(0)} 42% {transform:translateY(-7px)}}
    @keyframes flash {0%,100% {opacity:1} 38% {opacity:.28} 63% {opacity:1}}
    @media (prefers-reduced-motion:reduce) {.trace,.radar,.panel,.flash {animation:none}}
    </style>
